<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT v4 (溫暖暖色版)</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Tesseract.js 做自動圖片辨識 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- 引入 FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <style>
        /* 溫暖色調自訂背景與風格 */
        body {
            background-color: #FDFBF7; /* 暖米色底 */
            color: #5C4033; /* 暖咖啡色字 */
        }
    </style>
</head>
<body class="p-4 md:p-8 font-sans">
    <div class="max-w-6xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-center text-amber-800">☕ 溫暖系 OT 補水追蹤神器</h1>

        <!-- 總結看板：本月完場總額 -->
        <div class="bg-amber-50 border-l-4 border-amber-600 p-6 rounded-xl shadow-sm flex justify-around text-center">
            <div>
                <p class="text-amber-700 font-semibold">本月總 OT 日數</p>
                <p id="monthly-days" class="text-3xl font-bold text-amber-900">0 日</p>
            </div>
            <div>
                <p class="text-amber-700 font-semibold">本月總 OT 金額 (完場總額)</p>
                <p id="monthly-money" class="text-3xl font-bold text-amber-900">$0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- 左側：上傳與自動辨識表單 -->
            <div class="bg-white border border-amber-200 p-6 rounded-xl shadow-sm col-span-1 space-y-4">
                <h2 class="text-xl font-bold text-amber-900">📸 新增 OT 紀錄 (自動認字)</h2>
                <div>
                    <label class="block text-sm font-medium text-amber-800">上傳打卡相</label>
                    <input type="file" id="image-upload" accept="image/*" class="mt-1 block w-full text-sm text-amber-700 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200 cursor-pointer">
                    <p id="ocr-status" class="text-sm text-amber-600 mt-2 hidden animate-pulse">🔄 正在努力識別圖片中的日期與時間...</p>
                    <img id="image-preview" class="mt-2 hidden max-h-32 rounded border border-amber-200 mx-auto">
                </div>
                <div>
                    <label class="block text-sm font-medium text-amber-800">打卡日期 (可手動修改)</label>
                    <input type="date" id="record-date" class="mt-1 block w-full border-amber-200 rounded-md shadow-sm p-2 border focus:ring-amber-500 focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-amber-800">收工時間 (可手動修改)</label>
                    <input type="time" id="record-time" class="mt-1 block w-full border-amber-200 rounded-md shadow-sm p-2 border focus:ring-amber-500 focus:border-amber-500">
                    <p class="text-xs text-amber-600 mt-1">💡 6:15pm起計，7pm當1個鐘，7:15後至8pm當2個鐘。</p>
                </div>
                <button onclick="saveRecord()" class="w-full bg-amber-700 text-white font-bold py-2 px-4 rounded-lg hover:bg-amber-800 transition shadow">儲存紀錄</button>
            </div>

            <!-- 右側：日曆與每週小結清單 -->
            <div class="bg-white border border-amber-200 p-6 rounded-xl shadow-sm col-span-1 md:col-span-2 space-y-6">
                <h2 class="text-xl font-bold text-amber-900">📅 OT 日曆統計</h2>
                <div id="calendar" class="mb-4"></div>

                <div class="border-t border-amber-100 pt-4">
                    <h2 class="text-xl font-bold text-amber-900 mb-4">📊 每週中場結算小結 (本周、上周、各星期)</h2>
                    <!-- 每週小結清單容器 -->
                    <div id="weekly-sections" class="space-y-4">
                        <!-- 動態生成各星期小結 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('ot_records_v4')) || [];
        let currentBase64Image = '';
        let calendar;

        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                height: 380,
                events: getCalendarEvents()
            });
            calendar.render();
            updateUI();
        });

        // 圖片上傳 + 增強型自動 OCR 識別日期與時間
        document.getElementById('image-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                currentBase64Image = event.target.result;
                const preview = document.getElementById('image-preview');
                preview.src = currentBase64Image;
                preview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);

            const statusText = document.getElementById('ocr-status');
            statusText.classList.remove('hidden');

            // 使用 Tesseract 進行圖像辨識
            Tesseract.recognize(
                file,
                'eng+chi_tra',
                { logger: m => console.log(m) }
            ).then(({ data: { text } }) => {
                statusText.classList.add('hidden');
                console.log("OCR 识别结果:", text);

                // 尋找時間格式 (HH:MM)
                const timeMatch = text.match(/\b([01]?[0-9]|2[0-3]):([0-5][0-9])\b/);
                if (timeMatch) {
                    document.getElementById('record-time').value = timeMatch[0];
                }

                // 尋找日期格式 (YYYY-MM-DD 或 YYYY/MM/DD 或 YYYY年MM月DD日)
                const dateMatch = text.match(/\b(20\d{2})[-/.年](0[1-9]|1[0-2])[-/.月](0[1-9]|[12]\d|3[01])日?\b/);
                if (dateMatch) {
                    const year = dateMatch[1];
                    const month = dateMatch[2];
                    const day = dateMatch[3];
                    document.getElementById('record-date').value = `${year}-${month}-${day}`;
                }

                alert("✨ 圖片辨識完成！系統已自動嘗試填入日期與時間，請核對後按儲存。");
            }).catch(err => {
                statusText.classList.add('hidden');
                console.error(err);
                alert("⚠️ 自動識別遇到困難，圖片已保留，請手動調整日期與時間。");
            });
        });

        // 計算 OT 金額規則
        function calculateOT(timeStr) {
            if (!timeStr) return 0;
            const [hours, minutes] = timeStr.split(':').map(Number);
            const totalMinutes = hours * 60 + minutes;
            const thresholdMinutes = 18 * 60 + 15; // 6:15 PM

            if (totalMinutes <= thresholdMinutes) return 0;

            const diffMinutes = totalMinutes - thresholdMinutes;
            let hoursCount = 0;
            if (diffMinutes <= 45) {
                hoursCount = 1; // 6:15 到 7:00 之間當 1 個鐘
            } else {
                hoursCount = 1 + Math.ceil((diffMinutes - 45) / 60);
            }
            return hoursCount * 100;
        }

        // 儲存紀錄
        function saveRecord() {
            const date = document.getElementById('record-date').value;
            const time = document.getElementById('record-time').value;
            
            if (!date || !time) {
                alert("請確保填好日期同收工時間先好儲存！");
                return;
            }

            const otMoney = calculateOT(time);
            
            const newRecord = {
                id: Date.now(),
                date: date,
                time: time,
                otMoney: otMoney,
                image: currentBase64Image,
                isPaid: false
            };

            records.push(newRecord);
            localStorage.setItem('ot_records_v4', JSON.stringify(records));
            
            document.getElementById('record-date').value = '';
            document.getElementById('record-time').value = '';
            document.getElementById('image-upload').value = '';
            document.getElementById('image-preview').classList.add('hidden');
            currentBase64Image = '';

            updateUI();
            alert("✅ 成功儲存 OT 紀錄！");
        }

        function togglePaid(id) {
            const record = records.find(r => r.id === id);
            if (record) {
                record.isPaid = !record.isPaid;
                localStorage.setItem('ot_records_v4', JSON.stringify(records));
                updateUI();
            }
        }

        function deleteRecord(id) {
            if(confirm("確定要刪除呢筆紀錄？")) {
                records = records.filter(r => r.id !== id);
                localStorage.setItem('ot_records_v4', JSON.stringify(records));
                updateUI();
            }
        }

        // 取得日期屬於該月的第幾個星期，以及是否本周/上周
        function getWeekCategory(dateStr) {
            const d = new Date(dateStr);
            const year = d.getFullYear();
            const month = d.getMonth();
            const dateNum = d.getDate();

            // 計算是當月第幾個星期 (以每 7 日區間粗分，或按星期一對齊)
            const firstDayOfMonth = new Date(year, month, 1);
            const weekNumber = Math.ceil((dateNum + firstDayOfMonth.getDay()) / 7);
            
            const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
            const weekTitle = `${monthNames[month]}第${weekNumber}星期`;

            // 檢查是否本周或上周
            const today = new Date();
            const isCurrentWeek = isWithinWeek(d, today, 0);
            const isLastWeek = isWithinWeek(d, today, -1);

            let tag = weekTitle;
            if (isCurrentWeek) tag = "🔥 本周";
            else if (isLastWeek) tag = "⏳ 上周";

            return { tag, weekTitle, yearMonth: `${year}-${month}` };
        }

        function isWithinWeek(targetDate, referenceDate, weekOffset) {
            const d = new Date(referenceDate);
            const day = d.getDay();
            const diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1) + (weekOffset * 7);
            
            const startOfWeek = new Date(d.setDate(diffToMonday));
            startOfWeek.setHours(0,0,0,0);
            
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(endOfWeek.getDate() + 6);
            endOfWeek.setHours(23,59,59,999);

            return targetDate >= startOfWeek && targetDate <= endOfWeek;
        }

        // 更新介面與分組顯示
        function updateUI() {
            let monthlyDays = 0;
            let monthlyMoney = 0;

            const today = new Date();
            records.sort((a, b) => new Date(b.date) - new Date(a.date));

            // 計算本月總額
            records.forEach(record => {
                const targetDate = new Date(record.date);
                if (targetDate.getFullYear() === today.getFullYear() && targetDate.getMonth() === today.getMonth()) {
                    monthlyDays++;
                    monthlyMoney += record.otMoney;
                }
            });

            document.getElementById('monthly-days').innerText = `${monthlyDays} 日`;
            document.getElementById('monthly-money').innerText = `$${monthlyMoney}`;

            // 按群組分類 (本周、上周、1月第1星期等)
            const groups = {};
            records.forEach(record => {
                const { tag } = getWeekCategory(record.date);
                if (!groups[tag]) groups[tag] = [];
                groups[tag].push(record);
            });

            const container = document.getElementById('weekly-sections');
            container.innerHTML = '';

            if (Object.keys(groups).length === 0) {
                container.innerHTML = `<p class="text-amber-600 text-center py-4">暫時未有任何 OT 紀錄，快啲上傳第一張相啦！</p>`;
            }

            for (const [groupName, groupRecords] of Object.entries(groups)) {
                let groupDays = groupRecords.length;
                let groupMoney = groupRecords.reduce((sum, r) => sum + r.otMoney, 0);

                let sectionHtml = `
                    <div class="border border-amber-200 rounded-lg p-4 bg-amber-50/50 shadow-xs">
                        <div class="flex justify-between items-center mb-2 pb-2 border-b border-amber-200">
                            <span class="font-bold text-amber-900 text-lg">${groupName}</span>
                            <span class="text-sm font-semibold text-amber-800 bg-amber-200/60 px-3 py-1 rounded-full">
                                小結：${groupDays} 日 | 總計 $${groupMoney}
                            </span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="min-w-full text-left text-sm">
                                <thead>
                                    <tr class="text-amber-700 text-xs uppercase">
                                        <th class="py-1 px-2">日期</th>
                                        <th class="py-1 px-2">收工時間</th>
                                        <th class="py-1 px-2">補水</th>
                                        <th class="py-1 px-2">相片</th>
                                        <th class="py-1 px-2">狀態</th>
                                        <th class="py-1 px-2">操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                groupRecords.forEach(record => {
                    sectionHtml += `
                        <tr class="border-b border-amber-100 hover:bg-amber-100/40">
                            <td class="py-2 px-2 text-amber-900">${record.date}</td>
                            <td class="py-2 px-2 font-semibold text-amber-900">${record.time}</td>
                            <td class="py-2 px-2 text-amber-800 font-bold">$${record.otMoney}</td>
                            <td class="py-2 px-2">
                                ${record.image ? `<a href="${record.image}" target="_blank" class="text-amber-700 underline font-medium">查看相片</a>` : '<span class="text-amber-400">無相片</span>'}
                            </td>
                            <td class="py-2 px-2">
                                <button onclick="togglePaid(${record.id})" class="px-2.5 py-1 rounded text-white text-xs font-bold ${record.isPaid ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-rose-500 hover:bg-rose-600'} transition">
                                    ${record.isPaid ? '✅ 已收款' : '❌ 未收款'}
                                </button>
                            </td>
                            <td class="py-2 px-2">
                                <button onclick="deleteRecord(${record.id})" class="text-amber-400 hover:text-rose-600">🗑️</button>
                            </td>
                        </tr>
                    `;
                });

                sectionHtml += `</tbody></table></div></div>`;
                container.innerHTML += sectionHtml;
            }

            calendar.removeAllEvents();
            calendar.addEventSource(getCalendarEvents());
        }

        function getCalendarEvents() {
            return records.map(record => ({
                title: `$${record.otMoney} ${record.isPaid ? '✅' : '❌'}`,
                start: record.date,
                color: record.isPaid ? '#059669' : '#DC2626'
            }));
        }
    </script>
</body>
</html>
